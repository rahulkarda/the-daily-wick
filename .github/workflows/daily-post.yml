name: Daily post + newsletter

on:
  schedule:
    # 3pm IST target (-2hr buffer) = 1pm IST = 07:30 UTC
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, generate to tmp/ without committing or sending'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      SITE_URL: https://rahulkarda.github.io/the-daily-wick
      CURATOR_NAME: ${{ vars.CURATOR_NAME || 'Rahul Karda' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate today's post
        id: gen
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/generate-daily-post.mjs --dry-run
          else
            node scripts/generate-daily-post.mjs
          fi

      - name: Commit and push
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "daily-wick-bot"
          git config user.email "actions@github.com"
          git add src/content/posts/ content/state/ src/content/newsletter-issues/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit (post may already exist for today)."
            exit 0
          fi
          git commit -m "post: $(date -u +%Y-%m-%d)"
          git push origin main

      - name: Send newsletter
        id: send
        if: ${{ inputs.dry_run != 'true' }}
        run: node scripts/send-daily-newsletter.mjs

      - name: Commit newsletter archive marker
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git add src/content/newsletter-issues/ content/state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No newsletter archive changes."
            exit 0
          fi
          git commit -m "newsletter: $(date -u +%Y-%m-%d) [skip ci]"
          git push origin main

      - name: Open or update failure issue
        # Triggers either when an earlier step failed (build/generate/commit
        # crashed) OR when the newsletter send step set send_failed=true via
        # its $GITHUB_OUTPUT marker. The post itself is already committed in
        # the latter case; this just surfaces the email failure.
        if: |
          inputs.dry_run != 'true' &&
          (failure() || steps.send.outputs.send_failed == 'true')
        uses: actions/github-script@v7
        env:
          SEND_ERROR: ${{ steps.send.outputs.send_error }}
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sendError = process.env.SEND_ERROR || '';
            const label = 'daily-post-failure';

            // Make sure the label exists (idempotent — ignore "already exists")
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'B5563A',
                description: 'Automated cron failed for The Daily Wick',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            // Look for an open issue with our label
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            const isSendFailure = sendError !== '';
            const title = isSendFailure
              ? `Newsletter send failed (${today})`
              : `Daily post failed (${today})`;
            const intro = isSendFailure
              ? `The post for **${today}** committed cleanly, but the Buttondown send step failed.`
              : `Daily-post workflow failed on **${today}**.`;

            const body = [
              intro,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: ${context.sha.slice(0, 7)}`,
              isSendFailure ? `- Error: ${sendError}` : null,
              ``,
              isSendFailure
                ? `Triage: check Buttondown account status, key validity, and the failed-sends log at \`content/state/failed-sends.json\`. The post is live on the site; you can manually resend if needed.`
                : `Open this issue, click the run link, and read the failed step's logs. Common culprits: Gemini quota, Unsplash 401 (key rotated), commit conflict.`,
            ].filter((l) => l !== null).join('\n');

            if (open.length === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body: `Another failure on **${today}** — ${isSendFailure ? 'newsletter send' : 'workflow'} — run: ${runUrl}${sendError ? `\n\nError: ${sendError}` : ''}`,
              });
            }
